
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>River Watch | Flood Intelligence</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0a1923;
      font-family: Arial, sans-serif;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #eee5d4;
      text-align: center;
      padding: 24px;
    }

    .brand {
      color: #c6a66b;
      font: 25px Georgia, serif;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .message {
      color: #aab9c0;
      font-size: 13px;
      line-height: 1.7;
    }

    iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      position: fixed;
      inset: 0;
    }

    .fallback {
      color: #c6a66b;
      margin-top: 18px;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    <div class="brand">RIVER WATCH</div>
    <div class="message">
      Connecting to Ireland's flood intelligence dashboard...<br>
      Please wait.
    </div>
    <a class="fallback"
       href="https://script.google.com/macros/s/AKfycbxfVZgGmerZR3BJfg9C5LntroBpFH5qzLCrua8HmXQ3UriiGQcLZmHJryUUbbc-ppYDFA/exec"
       target="_blank">
       Open dashboard directly
    </a>
  </div>

  <iframe
    id="dashboard"
    title="River Watch Flood Intelligence Dashboard"
    src="https://script.google.com/macros/s/AKfycbxfVZgGmerZR3BJfg9C5LntroBpFH5qzLCrua8HmXQ3UriiGQcLZmHJryUUbbc-ppYDFA/exec"
    onload="document.getElementById('loading').style.display='none'; this.style.display='block';">
  </iframe>

</body>
</html>
